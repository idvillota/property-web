<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        var prefsRaw = localStorage.getItem('property-preferences');
        var prefsState = prefsRaw ? JSON.parse(prefsRaw).state : null;
        var brandTheme = (prefsState && prefsState.brandTheme) || 'operations';
        document.documentElement.setAttribute('data-app-theme', brandTheme);

        var scheme = (prefsState && prefsState.colorScheme) || localStorage.getItem('mantine-color-scheme-value') || 'auto';
        if (scheme === 'auto') {
          scheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/host-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Property" />
    <title>Property</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
